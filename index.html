<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#edf4f3" />
    <meta
      name="description"
      content="Поделитесь впечатлением о визите в кофейню «Штиль» в Актау. Выберите бариста и оставьте отзыв о сервисе."
    />
    <title>Штиль — отзыв о визите</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script src="src/bootstrap.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Prata&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="assets/caspian-water.webp" />
    <link rel="stylesheet" href="style.css" />
    <script src="vendor/qrcode.min.js" defer></script>
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <div class="caspian-background" aria-hidden="true">
      <div class="caspian-water"></div>
      <div class="sea-shade"></div>
    </div>
    <a class="skip-link" href="#main">Перейти к содержимому</a>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="./" aria-label="Штиль — главная"
          ><svg viewBox="0 0 44 44" aria-hidden="true">
            <path
              d="M4 14c6-8 12 8 18 0s12 8 18 0M4 23c6-8 12 8 18 0s12 8 18 0M4 32c6-8 12 8 18 0s12 8 18 0"
            /></svg
          ><span
            ><strong>штиль<span>.</span></strong
            ><small>КОФЕЙНЯ · АКТАУ</small></span
          ></a
        >
        <div class="appearance-controls">
          <button
            type="button"
            class="icon-button"
            id="theme-toggle"
            aria-label="Включить тёмную тему"
            aria-pressed="false"
          >
            <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M20.5 13.4A8.5 8.5 0 0 1 10.6 3.5 8.5 8.5 0 1 0 20.5 13.4Z"
              /></svg
            ><svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"
              />
            </svg></button
          ><button
            type="button"
            class="icon-button motion-button"
            id="motion-toggle"
            aria-label="Приостановить анимацию"
            aria-pressed="true"
          >
            <span aria-hidden="true">≈</span>
          </button>
        </div>
      </header>
      <div id="demo-banner" class="demo-banner" role="status" hidden>
        Демо · без отправки данных
      </div>
      <main id="main" class="guest-layout">
        <h1 class="visually-hidden">Штиль — отзыв о визите</h1>
        <section
          id="screen-main"
          class="screen staff-panel"
          aria-labelledby="staff-heading"
        >
          <h2 id="staff-heading" tabindex="-1">Кто вас обслужил?</h2>
          <p class="selection-hint">Выберите имя</p>
          <div id="staff-status" class="staff-status" role="status">
            Загружаем команду…
          </div>
          <div id="staff-grid" class="staff-grid" aria-busy="true"></div>
          <button
            class="secondary-button"
            id="retry-staff"
            type="button"
            hidden
          >
            Попробовать снова
          </button>
        </section>
        <section
          id="screen-qr"
          class="screen qr-panel"
          aria-labelledby="qr-heading"
          hidden
        >
          <div class="qr-topline">
            <button class="text-button" id="back-btn" type="button">
              <span aria-hidden="true">←</span> К выбору
            </button>
            <p>Возврат через <span id="timer">20</span> с</p>
          </div>
          <h2 id="qr-heading" tabindex="-1">
            Бариста: <span id="qr-barista-name"></span>
          </h2>
          <p class="panel-description">Сканируйте камерой телефона</p>
          <div class="qr-frame">
            <div
              id="qrcode"
              role="img"
              aria-label="QR-код для отзыва о выбранном бариста"
            ></div>
          </div>
          <div class="qr-actions">
            <a class="feedback-link" id="feedback-link" href="feedback.html"
              >Открыть отзыв <span aria-hidden="true">↗</span></a
            >
            <button id="extend-timer" type="button">Ещё 20 секунд</button>
          </div>
          <div class="timer-track" aria-hidden="true">
            <div id="timer-progress"></div>
          </div>
          <p id="qr-status" role="status" class="qr-status"></p>
        </section>
        <a id="entry-mode-link" class="entry-mode-link" href="?kiosk=1"
          >Показать QR-коды</a
        >
      </main>
      <noscript
        ><p class="noscript">
          Включите JavaScript, чтобы оставить отзыв.
        </p></noscript
      >
    </div>
  </body>
</html>
