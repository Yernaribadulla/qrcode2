<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#edf4f3" />
    <meta
      name="description"
      content="Поделитесь впечатлением о визите в кофейню «Штиль» в Актау. Выберите бариста и оставьте отзыв о сервисе."
    />
    <title>Штиль — отзыв о визите</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script src="src/bootstrap.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Prata&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="assets/caspian-water.webp" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="src/feedback.js"></script>
  </head>
  <body>
    <div class="caspian-background" aria-hidden="true">
      <div class="caspian-water"></div>
      <div class="sea-shade"></div>
    </div>
    <a class="skip-link" href="#main">Перейти к содержимому</a>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="./" aria-label="Штиль — главная"
          ><svg viewBox="0 0 44 44" aria-hidden="true">
            <path
              d="M4 14c6-8 12 8 18 0s12 8 18 0M4 23c6-8 12 8 18 0s12 8 18 0M4 32c6-8 12 8 18 0s12 8 18 0"
            /></svg
          ><span
            ><strong>штиль<span>.</span></strong
            ><small>КОФЕЙНЯ · АКТАУ</small></span
          ></a
        >
        <div class="appearance-controls">
          <button
            type="button"
            class="icon-button"
            id="theme-toggle"
            aria-label="Включить тёмную тему"
            aria-pressed="false"
          >
            <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M20.5 13.4A8.5 8.5 0 0 1 10.6 3.5 8.5 8.5 0 1 0 20.5 13.4Z"
              /></svg
            ><svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"
              />
            </svg></button
          ><button
            type="button"
            class="icon-button motion-button"
            id="motion-toggle"
            aria-label="Приостановить анимацию"
            aria-pressed="true"
          >
            <span aria-hidden="true">≈</span>
          </button>
        </div>
      </header>
      <div id="demo-banner" class="demo-banner" role="status" hidden>
        Демо · без отправки данных
      </div>
      <main id="main" class="guest-layout">
        <h1 class="visually-hidden">Штиль — отзыв о визите</h1>
        <section
          id="form-screen"
          class="feedback-card"
          aria-labelledby="form-heading"
        >
          <h2 id="form-heading">Как вам у нас?</h2>
          <p class="staff-context">
            <span id="barista-label">Ваш визит:</span>
            <strong id="barista-name">«Штиль»</strong>
          </p>
          <form id="feedback-form" novalidate>
            <fieldset id="feedback-fields">
              <legend class="visually-hidden">Ваша оценка и комментарий</legend>
              <fieldset
                class="rating-field"
                id="rating-field"
                aria-describedby="rating-caption"
              >
                <legend class="visually-hidden">Оценка обслуживания</legend>
                <div class="stars" id="stars">
                  <label class="star-option"
                    ><input
                      type="radio"
                      name="rating"
                      value="1"
                      aria-label="1 звезда" /><svg
                      viewBox="0 0 24 24"
                      aria-hidden="true"
                    >
                      <path
                        d="M12 2.5l2.9 6.2 6.8.7-5 4.7 1.4 6.7L12 17.6l-6.1 3.2 1.4-6.7-5-4.7 6.8-.7z"
                      /></svg></label
                  ><label class="star-option"
                    ><input
                      type="radio"
                      name="rating"
                      value="2"
                      aria-label="2 звезды" /><svg
                      viewBox="0 0 24 24"
                      aria-hidden="true"
                    >
                      <path
                        d="M12 2.5l2.9 6.2 6.8.7-5 4.7 1.4 6.7L12 17.6l-6.1 3.2 1.4-6.7-5-4.7 6.8-.7z"
                      /></svg></label
                  ><label class="star-option"
                    ><input
                      type="radio"
                      name="rating"
                      value="3"
                      aria-label="3 звезды" /><svg
                      viewBox="0 0 24 24"
                      aria-hidden="true"
                    >
                      <path
                        d="M12 2.5l2.9 6.2 6.8.7-5 4.7 1.4 6.7L12 17.6l-6.1 3.2 1.4-6.7-5-4.7 6.8-.7z"
                      /></svg></label
                  ><label class="star-option"
                    ><input
                      type="radio"
                      name="rating"
                      value="4"
                      aria-label="4 звезды" /><svg
                      viewBox="0 0 24 24"
                      aria-hidden="true"
                    >
                      <path
                        d="M12 2.5l2.9 6.2 6.8.7-5 4.7 1.4 6.7L12 17.6l-6.1 3.2 1.4-6.7-5-4.7 6.8-.7z"
                      /></svg></label
                  ><label class="star-option"
                    ><input
                      type="radio"
                      name="rating"
                      value="5"
                      aria-label="5 звёзд" /><svg
                      viewBox="0 0 24 24"
                      aria-hidden="true"
                    >
                      <path
                        d="M12 2.5l2.9 6.2 6.8.7-5 4.7 1.4 6.7L12 17.6l-6.1 3.2 1.4-6.7-5-4.7 6.8-.7z"
                      /></svg
                  ></label>
                </div>
                <p
                  class="rating-caption"
                  id="rating-caption"
                  aria-live="polite"
                >
                  Нажмите на звезду
                </p>
              </fieldset>
              <div class="comment-field">
                <label for="comment">Комментарий <span>По желанию</span></label
                ><textarea
                  id="comment"
                  name="comment"
                  maxlength="500"
                  rows="3"
                  placeholder="Поделитесь впечатлением"
                  aria-describedby="char-counter"
                ></textarea>
                <p class="char-counter" id="char-counter">0 / 500</p>
              </div>
            </fieldset>
            <p class="form-error" id="form-error" role="alert" hidden></p>
            <button
              type="submit"
              class="primary-button"
              id="submit-btn"
              disabled
            >
              <span class="submit-spinner" aria-hidden="true"></span
              ><span id="submit-btn-label">Отправить отзыв</span
              ><span class="submit-arrow" aria-hidden="true">↗</span>
            </button>
          </form>
        </section>
        <section
          id="thanks-screen"
          class="thanks-card"
          aria-labelledby="thanks-title"
          hidden
        >
          <div class="thanks-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48"><path d="m13 24 8 8 15-17" /></svg>
          </div>
          <h2 id="thanks-title" tabindex="-1">Спасибо!</h2>
          <p class="thanks-description">До встречи в «Штиле».</p>
          <div class="platform-review">
            <h3 class="visually-hidden">Штиль на других платформах</h3>
            <div class="platform-buttons">
              <a
                class="platform-btn"
                href="https://go.2gis.com/69d1W"
                data-platform="2gis"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Оставить отзыв на 2ГИС"
              >
                <svg class="platform-icon" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21z"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linejoin="round"
                  />
                  <circle
                    cx="12"
                    cy="9.3"
                    r="2.2"
                    stroke="currentColor"
                    stroke-width="1.6"
                  />
                </svg>
                <span>2ГИС</span> </a
              ><a
                class="platform-btn"
                href="https://yandex.kz/maps/ru/-/CTG-jA~0"
                data-platform="yandex"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Оставить отзыв на Яндекс Картах"
              >
                <svg class="platform-icon" viewBox="0 0 24 24" fill="none">
                  <circle
                    cx="12"
                    cy="12"
                    r="8.2"
                    stroke="currentColor"
                    stroke-width="1.6"
                  />
                  <path
                    d="M12 7.2v9.6M8.6 10l3.4-2.8L15.4 10"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                <span>Яндекс</span> </a
              ><a
                class="platform-btn"
                href="https://www.instagram.com/tequiero_coffee_sea"
                data-platform="instagram"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Перейти в Instagram"
              >
                <svg class="platform-icon" viewBox="0 0 24 24" fill="none">
                  <rect
                    x="4"
                    y="4"
                    width="16"
                    height="16"
                    rx="5"
                    stroke="currentColor"
                    stroke-width="1.6"
                  />
                  <circle
                    cx="12"
                    cy="12"
                    r="3.6"
                    stroke="currentColor"
                    stroke-width="1.6"
                  />
                  <circle cx="16.6" cy="7.4" r="0.9" fill="currentColor" />
                </svg>
                <span>Instagram</span>
              </a>
            </div>
          </div>
        </section>
      </main>
      <noscript
        ><p class="noscript">
          Включите JavaScript, чтобы оставить отзыв.
        </p></noscript
      >
    </div>
    <noscript
      ><img
        src="https://mc.yandex.ru/watch/110849170"
        class="metrics-pixel"
        alt=""
    /></noscript>
  </body>
</html>
